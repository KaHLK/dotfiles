add_newline = false
command_timeout = 200
format = "$directory$git_branch$git_status$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold white)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "white"
repo_root_style = "bold green"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol](green)[\\[$branch\\]](blue) "
symbol = " "

[git_status]
format     = """
[$ahead]($style)\
[$diverged]($style)\
[$behind]($style)\
[$conflicted](bg:red fg:black)\
[$up_to_date]($style)\
[$modified](fg:red)\
[$staged](fg:yellow)\
[$untracked](fg:purple)\
"""
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "?${count} "
modified   = "${count} "
stashed    = ""
staged     = "+${count} "
renamed    = ""
deleted    = ""
